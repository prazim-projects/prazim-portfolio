# Automated workflow for deploying a Nuxt 3 site to GitHub Pages
name: Deploy Nuxt App to GitHub Pages

on:
  # Trigger the workflow automatically on every push to your main branch
  push:
    branches: ["main"]

  # Allows you to trigger this workflow manually from the Actions tab on GitHub
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent duplicate deployments from running at the same time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate static application files
        run: npx nuxi generate

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Nuxt saves production-ready static files inside this folder path
          path: './.output/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
